name: CI Mobile

# PATH FILTERING IS LOAD-BEARING — see the note in ci-backend.yml.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
      # The toolchain version both this workflow and developers read (TODO-48).
      - '.nvmrc'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
      # The toolchain version both this workflow and developers read (TODO-48).
      - '.nvmrc'
  # deploy/EAS workflows can call this as a gate.
  workflow_call:

concurrency:
  group: ci-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the toolchain version, shared with
          # developers' shells (TODO-48). Hardcoding it here let CI sit on 22
          # while a contributor ran 24, where the suite failed.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      # Ordered cheapest-and-most-specific first, as in ci-web.yml.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Node-environment Vitest over the pure modules only — utils/ and the
      # services whose native dependencies are fully mocked away.
      # See mobile/vitest.config.ts for why this is not jest-expo.
      - name: Test
        run: npm run test:run
