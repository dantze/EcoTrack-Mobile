name: CI Web

# PATH FILTERING IS LOAD-BEARING — see the note in ci-backend.yml.
on:
  pull_request:
    paths:
      - 'web/**'
      # The fulfilment golden fixture: fulfilment.test.ts reads it, and the
      # backend suite reads the same file, so a change there must run BOTH.
      - 'shared/**'
      - '.github/workflows/ci-web.yml'
      - '.github/scripts/bundle_budget.py'
      # The toolchain version both this workflow and developers read (TODO-48).
      - '.nvmrc'
  push:
    branches: [main]
    paths:
      - 'web/**'
      # The fulfilment golden fixture: fulfilment.test.ts reads it, and the
      # backend suite reads the same file, so a change there must run BOTH.
      - 'shared/**'
      - '.github/workflows/ci-web.yml'
      - '.github/scripts/bundle_budget.py'
      # The toolchain version both this workflow and developers read (TODO-48).
      - '.nvmrc'
  # deploy.yml calls this workflow as its gate.
  workflow_call:

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the toolchain version, shared with
          # developers' shells (TODO-48). Hardcoding it here let CI sit on 22
          # while a contributor ran 24, where the suite failed.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # Ordered cheapest-and-most-specific first so a PR fails on the smallest
      # possible signal. `if: always()` on the later steps would hide which one
      # broke, so it is deliberately absent — first failure stops the job.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      # LIVE mode, because that is the artefact users download (TODO-55).
      #
      # `src/lib/config.ts` defaults VITE_DATA_MODE to 'mock', so this step used
      # to build — and the budget below used to gate — a bundle nobody is served.
      # Vercel builds live: Terraform writes VITE_DATA_MODE=live into the
      # project. The two differ by 8.6 kB gzip because `"sideEffects"` lets
      # Rollup shake the seeded mock store out of a live build (TODO-54/59), so
      # the gate was reading 247.7 kB where the deployed bundle is 239.1.
      #
      # It erred high, which is the safe side — but it could invert silently: a
      # mock-only dependency inflates a number nobody ships, and a live-only one
      # escapes the budget entirely. The second is the one that matters.
      #
      # VITE_API_BASE_URL is deliberately NOT set. Measured both ways: an
      # absolute Cloud Run URL versus the `/api` fallback moves the total by
      # 0.1 kB, which is one inlined string. Setting it would mean writing a
      # plausible-looking production URL into CI for no signal, and a fake URL
      # in a workflow is something a reader can mistake for the real one.
      - name: Build
        env:
          VITE_DATA_MODE: live
        run: npm run build

      # Bundle size only ever drifts upward, one innocent import at a time.
      # Budgets the EAGER chunks only — lazy route chunks are excluded on
      # purpose, see the script header.
      - name: Bundle budget
        working-directory: .
        run: python3 .github/scripts/bundle_budget.py web/dist
