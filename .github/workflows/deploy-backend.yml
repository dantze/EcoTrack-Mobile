name: Deploy Backend to Production

on:
  # Manual trigger - adds "Run workflow" button in GitHub
  workflow_dispatch: 
  
  # Auto trigger on push to main
  push:
    branches:
      - main
    paths:
      - 'backend/**'  # Only deploy when backend changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            echo "🚀 Starting deployment..."
            
            # Navigate to project directory
            cd ~/Dami-Prod-EcoTrack
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git pull origin main
            
            # Navigate to backend
            cd backend
            
            # Stop existing process using PID file (safer than pkill)
            echo "🛑 Stopping existing backend..."
            if [ -f ~/app.pid ]; then
              PID=$(cat ~/app.pid)
              if ps -p $PID > /dev/null 2>&1; then
                kill $PID || true
                sleep 2
              fi
              rm -f ~/app.pid
            fi
            
            # Build the application
            echo "🔨 Building application..."
            ./gradlew build -x test
            
            # Start the application in background and save PID
            echo "▶️ Starting application..."
            nohup java -jar build/libs/*.jar --spring.profiles.active=prod > ~/app.log 2>&1 &
            echo $! > ~/app.pid
            
            # Wait a moment for startup
            sleep 10
            
            # Check if it's running
            PID=$(cat ~/app.pid)
            if ps -p $PID > /dev/null 2>&1; then
              echo "✅ Deployment successful! App running with PID: $PID"
            else
              echo "❌ Deployment failed! Check ~/app.log"
              tail -50 ~/app.log
              exit 1
            fi
