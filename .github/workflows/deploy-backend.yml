name: Deploy Backend to Production

on:
  # Manual trigger - adds "Run workflow" button in GitHub
  workflow_dispatch: 
  
  # Auto trigger on push to main
  push:
    branches:
      - main
    paths:
      - 'backend/**'  # Only deploy when backend changes

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          DO_SPACES_BUCKET: ${{ secrets.DO_SPACES_BUCKET }}
          DO_SPACES_REGION: ${{ secrets.DO_SPACES_REGION }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: DB_URL,DB_USER,DB_PASS,DO_SPACES_ACCESS_KEY,DO_SPACES_SECRET_KEY,DO_SPACES_BUCKET,DO_SPACES_REGION
          script: |
            echo "🚀 Starting deployment..."
            echo "DB_URL=$DB_URL"
            echo "DB_USER=$DB_USER"
            
            # Navigate to project directory
            cd ~/Dami-Prod-EcoTrack
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git pull origin main
            
            # Navigate to backend
            cd backend
            
            # Stop existing process using PID file (safer than pkill)
            echo "🛑 Stopping existing backend..."
            if [ -f ~/app.pid ]; then
              PID=$(cat ~/app.pid)
              if ps -p $PID > /dev/null 2>&1; then
                kill $PID || true
                sleep 2
              fi
              rm -f ~/app.pid
            fi
            
            # Build the application
            echo "🔨 Building application..."
            ./gradlew build -x test
            
            # Start the application in background and save PID
            echo "▶️ Starting application..."
            # Use the Spring Boot executable jar (not the plain.jar)
            JAR_FILE=$(ls build/libs/*.jar | grep -v plain | head -1)
            echo "Using JAR: $JAR_FILE"
            nohup java -jar $JAR_FILE \
              --spring.profiles.active=prod \
              --spring.datasource.url="$DB_URL" \
              --spring.datasource.username="$DB_USER" \
              --spring.datasource.password="$DB_PASS" \
              --spaces.access-key="$DO_SPACES_ACCESS_KEY" \
              --spaces.secret-key="$DO_SPACES_SECRET_KEY" \
              --spaces.bucket="$DO_SPACES_BUCKET" \
              --spaces.region="$DO_SPACES_REGION" \
              > ~/app.log 2>&1 &
            echo $! > ~/app.pid
            
            # Wait a moment for startup
            sleep 15
            
            # Check if it's running
            PID=$(cat ~/app.pid)
            if ps -p $PID > /dev/null 2>&1; then
              echo "✅ Deployment successful! App running with PID: $PID"
            else
              echo "❌ Deployment failed! Check ~/app.log"
              tail -50 ~/app.log
              exit 1
            fi
