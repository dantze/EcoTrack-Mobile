plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

jar {
	enabled = false
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Actuator is here for one reason: /actuator/health is what the deploy
	// workflow polls after a restart (see .github/workflows/deploy.yml).
	// Only the "health" endpoint is exposed, with no details - see the
	// management.* keys in application.properties.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// DigitalOcean Spaces is S3-compatible; PhotoService points the AWS SDK at it.
	implementation 'software.amazon.awssdk:s3:2.54.7'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// A machine-readable summary of the run, consumed by
	// .github/scripts/junit_summary.py to build the CI job summary.
	reports {
		junitXml.required = true
		html.required = true
	}
	finalizedBy tasks.named('jacocoTestReport')
}

// ─── Coverage ────────────────────────────────────────────────────────────
// REPORT ONLY. There is deliberately no `jacocoTestCoverageVerification`
// wired into `check` and no violationRules: a threshold set at today's
// coverage would either be trivially low or would start failing unrelated
// PRs. CI prints the numbers (.github/scripts/jacoco_summary.py) so the
// trend is visible without gating the build.
jacoco {
	toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		csv.required = true
		html.required = true
	}
	// Generated / framework-only classes carry no logic worth measuring.
	classDirectories.setFrom(
		files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'com/example/damiProd/DamiProdApplication.class',
				'com/example/damiProd/dto/**',
			])
		})
	)
}

// Automatically load .env file when running locally with bootRun
tasks.named('bootRun') {
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			// Skip blank lines and comments
			if (line && !line.startsWith('#') && line.contains('=')) {
				def parts = line.split('=', 2)
				def key = parts[0].trim()
				def value = parts.length > 1 ? parts[1].trim() : ''
				environment key, value
			}
		}
	}
}
