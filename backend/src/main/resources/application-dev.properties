# Optional profile for developers who want to exercise real auth
# enforcement locally. It is redundant now that the base
# application.properties defaults ecotrack.security.enforce to true - it
# survives as an explicit, profile-scoped way to pin enforcement ON even if
# ECOTRACK_SECURITY_ENFORCE is set to false in the environment:
#
#   ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# See CLAUDE.md ("The security enforcement flag") for the full property list.
# The README has never documented it.
ecotrack.security.enforce=true
