# Optional profile for developers who want to exercise real auth
# enforcement locally (matches how "test" behaves). Not activated by
# default - local `bootRun` without a profile uses the base
# application.properties, same safe default as production
# (ecotrack.security.enforce=false), so existing local workflows are
# unaffected unless you opt in with:
#
#   ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# See README.md for details.
ecotrack.security.enforce=true
