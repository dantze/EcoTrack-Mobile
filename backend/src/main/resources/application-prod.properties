spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Construct the JDBC URL from environment variables set on the container.
#
# In production those come from Cloud Run: infra/main.tf sets DB_HOST to the
# Cloud SQL instance's PRIVATE IP, DB_PORT/DB_NAME/DB_USER as plain env, and
# DB_PASS from Secret Manager, resolved at instance start.
#
# A private IP rather than the Cloud SQL Auth proxy, deliberately: the proxy
# presents the database as a unix socket, and this plain JDBC URL cannot dial
# one without a socket factory on the classpath. That choice is the whole
# reason infra/ builds a VPC. Do not "simplify" it to the proxy without adding
# the driver to match.
#
# Locally the same three variables come from the backend service block in
# docker-compose.yml.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# admin.api.key / X-Admin-Key has been removed. /api/admin/** is now
# authorized by the caller's ADMIN role (see application.properties /
# SecurityConfig). This file intentionally does not set
# ecotrack.security.enforce: production inherits the base default, which is
# now "true", overridable per deployment via ECOTRACK_SECURITY_ENFORCE.
