spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Construct the JDBC URL from environment variables provided by Render
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# admin.api.key / X-Admin-Key has been removed. /api/admin/** is now
# authorized by the caller's ADMIN role once ecotrack.security.enforce=true
# (see application.properties / SecurityConfig). This file intentionally
# does not set ecotrack.security.enforce, so production inherits the safe
# default of "false" until the web app has been fully switched over to
# token-based auth.
