spring.application.name=damiProd

# H2 Database Configuration for Persistence
spring.datasource.url=jdbc:h2:file:./data/damiprod
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console: OFF everywhere. It is an arbitrary-JDBC-URL client, and this
# file is inherited by prod (which runs Postgres but still ships the H2 driver),
# so leaving it enabled meant an unauthenticated /h2-console on the public IP.
# SecurityConfig also denies /h2-console/** outright, in both enforcement modes.
# Turn it back on locally (--spring.h2.console.enabled=true) if you need it.
spring.h2.console.enabled=false

# Hibernate ddl-auto (update schema without destroying data)
spring.jpa.hibernate.ddl-auto=update

# DigitalOcean Spaces Configuration (S3-compatible)
# Defaults are empty — override via env vars or command-line args
spaces.access-key=${DO_SPACES_ACCESS_KEY:}
spaces.secret-key=${DO_SPACES_SECRET_KEY:}
spaces.bucket=${DO_SPACES_BUCKET:}
spaces.region=${DO_SPACES_REGION:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== Auth / Security ====================
# Whether /api/** requires a valid access token (and /api/admin/** the ADMIN
# role). Defaults to false HERE so that production - which loads this file
# plus application-prod.properties, and does not override this key - keeps
# accepting the existing token-less mobile app. Explicitly set to true in
# application-dev.properties and application-test.properties. See README.md.
ecotrack.security.enforce=false

# Access token lifetime (minutes) and refresh token lifetime (days).
ecotrack.security.access-token-ttl-minutes=30
ecotrack.security.refresh-token-ttl-days=60

# Login throttle. Two counters per attempt (see LoginRateLimiter):
#   max-failures              - per username+IP; the IP comes from X-Forwarded-For
#                               when present and is therefore spoofable.
#   max-failures-per-username - per account, which an attacker cannot vary, so
#                               rotating-IP guessing still trips it.
# Both use the same window and lockout duration. max-tracked-keys bounds the
# in-memory map so a flood of invented usernames cannot exhaust the heap.
ecotrack.security.login-throttle.max-failures=5
ecotrack.security.login-throttle.max-failures-per-username=10
ecotrack.security.login-throttle.window-minutes=15
ecotrack.security.login-throttle.lockout-minutes=15
ecotrack.security.login-throttle.max-tracked-keys=10000

# bcrypt cost factor for newly stored passwords. Existing hashes keep the cost
# they were created with, so raising this is always safe.
ecotrack.security.bcrypt-strength=12

# Session hygiene. Above the cap, an employee's least-recently-used sessions are
# revoked on login (a 60-day refresh token on a forgotten device is a live key).
# Sessions unusable for longer than the retention window are deleted nightly.
ecotrack.security.max-sessions-per-user=10
ecotrack.security.session-retention-days=30
ecotrack.security.session-prune-cron=0 30 3 * * *

# Answer 401 when a request presents a Bearer token that is unknown, expired or
# revoked - even while enforce=false. Requests with NO Authorization header are
# untouched, which is what keeps the token-less mobile app working. Without this,
# a revoked token would keep working through the open gate and logout/theft
# revocation would be invisible to the client.
ecotrack.security.reject-invalid-bearer=true

# Comma-separated list of origins allowed to call the API with credentials.
# Update this to match the deployed web app's real origin.
ecotrack.cors.allowed-origins=http://localhost:5173,http://146.190.224.202

# Google Sign-In (admin-provisioned only - see AuthService#loginWithGoogle).
# Leave client-id empty to disable Google sign-in entirely (fails closed).
ecotrack.google.client-id=${GOOGLE_CLIENT_ID:}
# Optional: restrict Google sign-in to a single Workspace domain, e.g. "ecotrack.ro".
ecotrack.google.allowed-domain=${GOOGLE_ALLOWED_DOMAIN:}

# ==================== Actuator (health only) ====================
# /actuator/health is the liveness probe the deploy workflow polls after a
# restart (.github/workflows/deploy-backend.yml). Nothing else is exposed and
# no details are shown, so this adds no readable surface beyond "UP"/"DOWN"
# even though SecurityConfig leaves non-/api paths permitAll in both
# enforcement modes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
