spring.application.name=damiProd

# H2 Database Configuration for Persistence
spring.datasource.url=jdbc:h2:file:./data/damiprod
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console
spring.h2.console.enabled=true

# Hibernate ddl-auto (update schema without destroying data)
spring.jpa.hibernate.ddl-auto=update

# DigitalOcean Spaces Configuration (S3-compatible)
# Defaults are empty — override via env vars or command-line args
spaces.access-key=${DO_SPACES_ACCESS_KEY:}
spaces.secret-key=${DO_SPACES_SECRET_KEY:}
spaces.bucket=${DO_SPACES_BUCKET:}
spaces.region=${DO_SPACES_REGION:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== Auth / Security ====================
# Whether /api/** requires a valid access token (and /api/admin/** the ADMIN
# role). Defaults to false HERE so that production - which loads this file
# plus application-prod.properties, and does not override this key - keeps
# accepting the existing token-less mobile app. Explicitly set to true in
# application-dev.properties and application-test.properties. See README.md.
ecotrack.security.enforce=false

# Access token lifetime (minutes) and refresh token lifetime (days).
ecotrack.security.access-token-ttl-minutes=30
ecotrack.security.refresh-token-ttl-days=60

# Login throttle (per username+IP): lock out after this many failures within
# the window, for this long.
ecotrack.security.login-throttle.max-failures=5
ecotrack.security.login-throttle.window-minutes=15
ecotrack.security.login-throttle.lockout-minutes=15

# Comma-separated list of origins allowed to call the API with credentials.
# Update this to match the deployed web app's real origin.
ecotrack.cors.allowed-origins=http://localhost:5173,http://146.190.224.202

# Google Sign-In (admin-provisioned only - see AuthService#loginWithGoogle).
# Leave client-id empty to disable Google sign-in entirely (fails closed).
ecotrack.google.client-id=${GOOGLE_CLIENT_ID:}
# Optional: restrict Google sign-in to a single Workspace domain, e.g. "ecotrack.ro".
ecotrack.google.allowed-domain=${GOOGLE_ALLOWED_DOMAIN:}
