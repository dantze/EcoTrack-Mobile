spring.application.name=damiProd

# H2 Database Configuration for Persistence
spring.datasource.url=jdbc:h2:file:./data/damiprod
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console: OFF everywhere. It is an arbitrary-JDBC-URL client, and this
# file is inherited by prod (which runs Postgres but still ships the H2 driver),
# so leaving it enabled meant an unauthenticated /h2-console on the public IP.
# SecurityConfig also denies /h2-console/** outright, in both enforcement modes.
# Turn it back on locally (--spring.h2.console.enabled=true) if you need it.
spring.h2.console.enabled=false

# Hibernate ddl-auto (update schema without destroying data)
spring.jpa.hibernate.ddl-auto=update

# DigitalOcean Spaces Configuration (S3-compatible)
# Defaults are empty — override via env vars or command-line args
spaces.access-key=${DO_SPACES_ACCESS_KEY:}
spaces.secret-key=${DO_SPACES_SECRET_KEY:}
spaces.bucket=${DO_SPACES_BUCKET:}
spaces.region=${DO_SPACES_REGION:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== Auth / Security ====================
# Whether /api/** requires a valid access token (and /api/admin/** the ADMIN
# role). Defaults to TRUE here and should stay that way: there are no
# token-less clients left to break - the only way to obtain a session is
# device enrollment, which issues tokens. Production loads this file plus
# application-prod.properties, which does not override the key, so prod
# inherits this default unless ECOTRACK_SECURITY_ENFORCE says otherwise.
# See CLAUDE.md ("The security enforcement flag") for the full property list.
ecotrack.security.enforce=${ECOTRACK_SECURITY_ENFORCE:true}

# Access token lifetime (minutes) and refresh token lifetime (days).
ecotrack.security.access-token-ttl-minutes=30
ecotrack.security.refresh-token-ttl-days=365

# Refresh tokens rotate on every use, so an actively used device never has to
# re-enroll; only one genuinely idle for the full window comes back to the
# request screen.
#
# 365 is deliberate, and it is the number the code documents - TokenService's
# @Value fallback is 365 too, so an absent property cannot silently give a
# different lifetime than this file states. The reason is that there is no
# password to fall back on: a driver whose refresh token expires mid-shift
# cannot sign back in, they have to file an enrollment request and wait for an
# admin to approve it. A year means that only happens to a device genuinely
# unused for a year.
#
# The cost is stated plainly: a lost or stolen phone holds a working credential
# for up to a year. Expiry is NOT what limits that; these are:
#   - the session cap below - a forgotten device falls off the end once the
#     employee enrolls on enough others;
#   - the nightly prune, which only removes sessions that are already unusable;
#   - AdminService.updateEmployee, which revokes every session an employee holds
#     whenever their ROLES change, and deleting the employee outright.
# DELETE /api/auth/sessions/{id} revokes the CALLER's own session only, so it is
# the answer when the owner still has a second signed-in device and none when
# they do not - see TODO-56.

# Session hygiene. Above the cap, an employee's least-recently-used sessions are
# revoked when a new one is issued (a long-lived refresh token on a forgotten
# device is a live key).
# Sessions unusable for longer than the retention window are deleted nightly.
ecotrack.security.max-sessions-per-user=10
ecotrack.security.session-retention-days=30
ecotrack.security.session-prune-cron=0 30 3 * * *

# Answer 401 when a request presents a Bearer token that is unknown, expired or
# revoked - even while enforce=false. Requests with NO Authorization header are
# untouched, which is what lets the enrollment endpoints stay reachable. Without this,
# a revoked token would keep working through the open gate and logout/theft
# revocation would be invisible to the client.
ecotrack.security.reject-invalid-bearer=true

# Comma-separated list of origins allowed to call the API with credentials.
#
# This DEFAULT is the local development origin and nothing else. Production
# always sets ECOTRACK_CORS_ALLOWED_ORIGINS explicitly: infra/main.tf computes
# it from the Vercel project name plus any custom domains and puts it on the
# Cloud Run service, because the SPA and the API are on two different origins
# there and every API call is cross-origin (TODO-71).
#
# It used to also list http://146.190.224.202 - the droplet the VPS deployment
# ran on, which no longer exists. A default that names a dead host is worse
# than a short one: it looks like configuration and allows nothing useful.
#
# Getting this wrong is invisible from the server side. Cloud Run keeps
# answering /actuator/health, Vercel keeps serving the bundle, and the browser
# refuses every call between them - so check the browser console first if the
# app loads but every list is empty.
ecotrack.cors.allowed-origins=${ECOTRACK_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==================== Actuator (health only) ====================
# /actuator/health is the liveness probe the deploy workflow polls after a
# restart (.github/workflows/deploy.yml). Nothing else is exposed and
# no details are shown, so this adds no readable surface beyond "UP"/"DOWN"
# even though SecurityConfig leaves non-/api paths permitAll in both
# enforcement modes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# --- Device enrollment (the only way in; see EnrollmentService) ---
# How long an admin has to decide on a request, and how long an approved
# request stays collectable afterwards.
ecotrack.enrollment.request-ttl-minutes=10
ecotrack.enrollment.claim-ttl-minutes=10
# Guards the first-run "first user becomes ADMIN" rule with a one-time code
# printed to the server log. Turning this off means whoever reaches a freshly
# deployed server first owns it, with no password path to take it back.
ecotrack.enrollment.require-setup-code=true

# The first-run code, chosen up front instead of read out of the server log
# (TODO-36). Blank - the default - keeps the old behaviour: the server invents
# one at startup and prints it, which needs SSH to collect. Set this and whoever
# deploys already knows the code, so a non-technical person can perform the very
# first enrolment.
#
# Must be at least 12 characters; a shorter one is IGNORED with an error rather
# than obeyed, because /api/enrollment/request is public and its rate limit is
# keyed on a device id the client supplies. Generate it, do not invent it:
#   openssl rand -base64 18
#
# It applies to FIRST RUN ONLY. It is inert the moment an employee exists, and it
# is deliberately NOT accepted for the lockout recovery above: a code that sits
# in config and always mints an ADMIN is a password by another name, which is the
# one thing this system does not have.
ecotrack.enrollment.setup-code=${ECOTRACK_SETUP_CODE:}
ecotrack.enrollment.max-requests-per-device-per-hour=5

# Admin lockout recovery (TODO-30). When NO admin holds a usable session any
# more - the last one logged out, or lost the only phone they enrolled - nobody
# is left to approve an access request, and the first-run path does not reopen
# because it keys on an EMPTY employees table. Before this existed the only cure
# was deleting the database.
#
# With this on, that state logs a single-use recovery code (same place, same
# shape as the first-run code) and presenting it on /api/enrollment/request
# mints a new ADMIN. Reading the log needs server access, which is the whole
# security argument: someone who already has it could edit the database anyway.
#
# The code is ALWAYS required here, even when require-setup-code above is false.
# That flag exempts the first-run land-grab, which needs an attacker to beat the
# owner to a brand-new server; lockout is one button on one phone away, so it
# never gets the exemption.
#
# Set to false to keep the old behaviour, in which a lockout is permanent.
ecotrack.enrollment.allow-admin-recovery=true
