# In-memory H2, so tests never read or write the real data/damiprod.mv.db file.
#
# This URL is a FALLBACK and should not be what any test actually runs on.
# `jdbc:h2:mem:testdb` is a NAMED database and DB_CLOSE_DELAY=-1 keeps it alive
# for the whole JVM, so it outlived every Spring context in a run and all of
# them shared it - which was TODO-31: the classes exercising the first-user
# bootstrap cannot be @Transactional, so each committed an ADMIN that the next
# class then read. Every @SpringBootTest now carries @AutoConfigureTestDatabase
# and gets its own uniquely-named database per context (@DataJpaTest applies the
# same annotation itself). SuiteTests/DatabaseIsolationTest holds that rule and
# explains it; a test that ends up on the URL below has escaped it.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Recreate schema from scratch on every test run (safe because it's in-memory)
spring.jpa.hibernate.ddl-auto=create-drop

# No schema.sql / data.sql script initialisation.
#
# This does NOT disable DataLoader, whatever it used to say here: DataLoader is
# a @Component implementing CommandLineRunner, and SpringBootContextLoader runs
# the runners, so every @SpringBootTest context seeds the 4 role rows and the 11
# products into its own database. Verified, not assumed (TODO-31).
#
# Tests are written against that, so it is left alone. Note what changed with
# per-context databases: the seed used to happen ONCE for the whole JVM, into
# the shared database, and now happens once per context - same content either
# way, which is why nothing had to move. See TODO-74 for actually disabling it.
spring.sql.init.mode=never

# Security enforcement is ON by default under the "test" profile so that
# @SpringBootTest classes exercise the real (enforced) behaviour. Individual
# @WebMvcTest slices are NOT profiled and therefore see the base
# application.properties default (enforce=false) instead - see
# AuthEnforcementOnTest / AuthEnforcementOffTest for tests of both modes.
ecotrack.security.enforce=true
