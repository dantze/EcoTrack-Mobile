# Use a fresh in-memory H2 database for every test run.
# This means tests never read or write to the real data/damiprod.mv.db file.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Recreate schema from scratch on every test run (safe because it's in-memory)
spring.jpa.hibernate.ddl-auto=create-drop

# Disable DataLoader so tests don't get pre-populated with demo data
spring.sql.init.mode=never
