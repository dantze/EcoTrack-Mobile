# =============================================================================
# Docker Compose: Dev Hosted Environment (UI & Mobile Testing)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.dev-hosted.yml up -d --build
# =============================================================================

services:
  dev-postgres:
    image: postgres:16-alpine
    container_name: ecotrack_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-damiprod_dev}
      POSTGRES_USER: ${DB_USER:-damiprod_dev_user}
      POSTGRES_PASSWORD: ${DB_PASS:-dev_secure_password}
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-damiprod_dev_user} -d ${DB_NAME:-damiprod_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dev_network

  dev-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecotrack_dev_backend
    restart: unless-stopped
    depends_on:
      dev-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: dev-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-damiprod_dev}
      DB_USER: ${DB_USER:-damiprod_dev_user}
      DB_PASS: ${DB_PASS:-dev_secure_password}
      DO_SPACES_ACCESS_KEY: ${DO_SPACES_ACCESS_KEY:-}
      DO_SPACES_SECRET_KEY: ${DO_SPACES_SECRET_KEY:-}
      DO_SPACES_BUCKET: ${DO_SPACES_BUCKET:-damiprod-dev-storage}
      DO_SPACES_REGION: ${DO_SPACES_REGION:-fra1}
      ECOTRACK_SECURITY_ENFORCE: ${ECOTRACK_SECURITY_ENFORCE:-false}
      ECOTRACK_CORS_ALLOWED_ORIGINS: ${ECOTRACK_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${DEV_BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - dev_network

volumes:
  dev_postgres_data:
    driver: local

networks:
  dev_network:
    driver: bridge
